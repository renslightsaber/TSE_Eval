# ════════════════════════════════════════════════════════════════════════
# TSE_Eval — scoring policy
# ════════════════════════════════════════════════════════════════════════
# This file holds only what must be IDENTICAL across the three projects
# (TPEX / LLM-TSE / StyleTSE) for the baseline comparison to be fair.
#
# Run-specific values are CLI flags, not config:
#     --input  --output  --model-name  --source-csv  --group-by
#
# Precedence:  CLI  >  this file  >  built-in defaults (tse_eval/config.py)
#
# The resolved result is written to `<output>_config.json` next to the
# results. That sidecar — not this file — is what a paper should cite, since
# it also records library versions and the actual input manifest.
# ════════════════════════════════════════════════════════════════════════

# Working sample rate. PORTE-v3 is natively 24 kHz; SI-SDR / SI-SDRi /
# STOI / ESTOI are computed here. Metrics that are 16 kHz-only (PESQ,
# DNSMOS, WER, Speaker Similarity) resample internally — see the table in
# tse_eval/metrics.py. Do not lower this to 16000 for 24 kHz data: it would
# put SI-SDR and ESTOI out of step with the sibling projects' eval.py.
target_sr: 24000

# SI-SDR implementation: native | asteroid
#   native   - in-repo, no extra dependency (default)
#   asteroid - asteroid.metrics.get_metrics (pb_bss_eval underneath)
# The two agree to ~1e-13; tests/test_backends.py pins that. `native` is the
# default because `asteroid` pulls in 22 more packages (pytorch-lightning,
# torchmetrics, mir_eval, ...) and is declared only as a test extra.
#
# Measured on 30 real LLM-TSE predictions (PORTE-v3 test, 24 kHz, 2026-08-07):
#     native    6.73 ms/utt        asteroid   26.62 ms/utt   (3.96x)
#     max |native - asteroid|:  si_sdr 1.76e-11 · si_sdri 1.10e-11
#   -> Identical to 4 decimals. Pick either; the only real divergence is a silent
#      reference (native -> nan and the row drops; asteroid -> -80 dB floor, which
#      drags the mean). PORTE-v3 has none: min zero-mean energy 4.10e+01 over a
#      400-target sample, i.e. 9 orders above eps, 0/400 below.
#
# ★ Whichever you choose, EVERY system in a comparison must use the same one.
#   The per-run sidecar records `si_sdr_backend`, so a mismatch is detectable
#   afterwards. scripts/eval_llmtse.sh passes --si-sdr-backend explicitly rather
#   than inheriting this default, so the protocol is readable from the script.
si_sdr_backend: native

# Metric set for a default run.
#
# Measured cost per 15,000 utterances (5,000 rows x 3 systems), real PORTE-v3
# audio averaging 11 s, DNSMOS on CUDA:
#     SI-SDR family   2 min      STOI + ESTOI   28 min
#     PESQ           51 min      DNSMOS         44 min
#     spk_sim        20 min      WER           178 min   <- the expensive one
metrics:
  - si_sdr
  - si_sdri
  - input_si_sdr             # si_sdri = si_sdr - input_si_sdr, checkable in the CSV
  - input_si_sdr_pairwise    # estimate-independent baseline; equal across projects
  - stoi
  - estoi
  - pesq
  - dnsmos_sig
  - dnsmos_bak
  - dnsmos_ovrl
  - dnsmos_p808
  - spk_sim                  # ECAPA, ~20 min / 15,000 utt — cheap enough to keep on
  # - wer                    # Whisper large-v3, ~178 min / 15,000 utt.
                             # Left off so iteration stays fast.
  #
  # ★ To turn WER on, uncomment the line above — or name every metric you want
  #   on the command line. `--metrics all,wer` does NOT work: cli._resolve_metrics
  #   treats 'all' specially only when it is the *entire* argument, so 'all,wer'
  #   exits with "Unknown metric(s): ['all']". Enumerating is also self-documenting,
  #   which is why scripts/eval_llmtse.sh lists all 13 explicitly:
  #     --metrics si_sdr,si_sdri,input_si_sdr,input_si_sdr_pairwise,stoi,estoi,\
  #               pesq,dnsmos_sig,dnsmos_bak,dnsmos_ovrl,dnsmos_p808,wer,spk_sim

# DNSMOS onnxruntime settings. speechmos creates its ONNX sessions with no
# options and no providers at all, which costs a lot on this machine.
# Measured end-to-end on real PORTE-v3 audio (marginal cost, 60 rows - 20 rows):
#     as-is (threads=0, CPU)   1475 ms/utt  ->  369 min / 15,000 utt   1.0x
#     intra_op=4 (CPU)          550 ms/utt  ->  137 min                2.7x
#     intra_op=4 + CUDA         175 ms/utt  ->   44 min                8.4x  <- default
#   CUDA also pays ~40 s of one-time setup (~0.5 % of a 5,000-row run).
# ★ OMP_NUM_THREADS does nothing here — onnxruntime's intra-op pool is its own.
# ★ CUDA shifts DNSMOS values by up to ~3e-3 versus CPU (CPU-vs-CPU differs by 4e-7).
#   That is far below the two decimals DNSMOS is normally reported to, but EVERY
#   system in a comparison must use the same providers. The run's sidecar records
#   both what was requested and what onnxruntime actually used, so a mismatch is
#   detectable afterwards. Use `--dnsmos-providers cpu` to force CPU.
#
# ★★ LEVEL NORMALISATION — the one setting that silently rewrote our numbers.
#   DNSMOS is a no-reference regressor trained on conventionally-levelled speech,
#   so it is level-sensitive, and `speechmos` refuses input outside [-1, 1].
#   This project used to satisfy that with a hard clip, which meant DNSMOS scored
#   a *clipped* waveform whenever a model ran hot. LLM-TSE's output exceeds ±1 on
#   100 % of rows (median peak 4.94, max 17.25; rms +24 dB vs the reference), so
#   the median row had 5.5 % of its samples clipped — worst case 40.3 %.
#
#   Measured on 50 real rows, with the clean reference as an anchor:
#       condition                    sig    bak   ovrl   p808     peak   rms dBFS
#       pred, hard-clipped (old)    3.153  3.208  2.550  3.173    1.000     -8.1
#       pred, peak -> 0.95          3.346  3.517  2.847  3.494    0.950    -20.2
#       pred, rms -> -26 dBov       3.388  3.611  2.912  3.494    0.514    -26.0   <- default
#       reference, untouched        3.561  4.064  3.273  3.807    0.299    -30.3
#       reference, rms -> -26 dBov  3.559  4.042  3.273  3.807    0.502    -26.0
#
#   -26 dBov (ITU-T P.56) is the default because it leaves the clean reference's
#   score untouched (3.273 either way), so the anchor does not move. peak->0.95
#   shifts it to 3.211: a single short spike captures the peak and shrinks
#   everything else. Crest factor here reaches 31.7 dB, so ~2 % of files still
#   exceed ±1 after -26 dBov; those are scaled once more to peak 0.99 — scaled,
#   never clipped.
#
#   ★ EVERY system in a comparison must use the same normalisation, exactly as
#     with providers. `dnsmos_*_clipped` columns reproduce the old clipped
#     behaviour alongside the reported values, so nothing is lost and the two can
#     be compared directly. Unaffected by level (measured, difference < 1e-5):
#     SI-SDR family, STOI, ESTOI, PESQ, spk_sim — their published values stand.
dnsmos:
  intra_op_threads: 4
  providers: [CUDAExecutionProvider, CPUExecutionProvider]
  normalize: rms_-26dbov     # scale to -26 dBov RMS, guard peak at 0.99

# WER: Whisper transcription of the estimate vs the manifest's target_sentence.
# This is the same model LLM-TSE's eval.py uses, so the numbers are comparable.
# Summary aggregation is corpus micro-WER (total edits / total words), not the
# mean of per-row WER — that is the figure reported in TSE/ASR papers.
#
# ★ TEXT NORMALISATION. Comparing raw strings charges edits for case and
#   punctuation, which Whisper emits inconsistently from row to row:
#       REF: Although plump and healthy, Josiana was, we repeat, a perfect prude.
#       HYP: although plump and healthy josianna was we repeat a perfect prude
#       raw 0.5455 (6 edits/11) vs normalised 0.0909 (1 edit) — on a row whose
#       SI-SDR is 50.75 dB, i.e. an almost perfect reconstruction.
#   Over 5,000 LLM-TSE rows, corpus micro-WER falls 0.5932 -> 0.5240.
#
#   `whisper_english` uses the checkpoint's own normaliser (case, punctuation,
#   numbers, contractions, 1,740 spelling variants) via the tokenizer we already
#   load — no extra dependency or download. `wer_raw` keeps the unnormalised
#   figure, which is what llmtse/eval.py:43-45 computes, so the baseline's
#   published numbers stay reconcilable.
wer:
  model_id: openai/whisper-large-v3
  language: en
  normalize: whisper_english

# Speaker Similarity: cosine of ECAPA embeddings, estimate vs reference.
# ECAPA is 16 kHz-only and does NOT resample its input — a 24 kHz waveform
# yields wrong embeddings with no error at all (requirements_h200.txt [B-9]).
# The sample-rate policy handles that; do not bypass it.
spk_sim:
  model_id: speechbrain/spkrec-ecapa-voxceleb
