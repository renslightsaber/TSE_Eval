# ============================================================================
# StyleTSE Baseline — 중앙 설정 (dataset 인자 고정)
# ============================================================================
# 이 파일은 StyleTSEDataset / collate / DataLoader 인자를 한곳에 고정합니다.
# dataset.py 의 헬퍼가 이 파일을 읽어 dataset 을 만듭니다:
#   from dataset import load_config, StyleTSEDataset, collate_from_config
#   cfg = load_config("configs/config.yaml")
#   ds  = StyleTSEDataset.from_config(cfg, stage="stage1", split="train")
#
# StyleTSE 는 2-stage 로 학습합니다 (논문 arXiv:2501.09169, docs/reports/):
#   - Stage 1 : task = audio-text            (audio clue + text prompt)
#   - Stage 2 : task = mixed                 (샘플별 text-only / audio-only / audio-text)
#   - 평가    : task = text-only             (TPEX 공정 비교 조건)
# ============================================================================

# --- StyleTSEDataset 공통 인자 (Stage 무관) ---------------------------------
data:
  root: /home/work/my-datasets   # CSV root. 우선순위: env PORTE_V3_DATASET_PATH > 이 값 > dataset.py 상수
                                 # 오디오 실경로는 CSV 의 base_dir 컬럼이 지배하므로 여기와 무관하다
  mode: clean            # clean | noisy  → <root>/porte_v3_<mode>/porte_v3_<mode>_<split>.csv
  sample_rate: 24000     # PORTE-v3 native 24 kHz (silent resample 금지)
  max_audio_sec: 20.0    # 안전캡: 이보다 긴 것만 절단. PORTE-v3 max 17.2s → 사실상 full-length
  enroll_sec: 3.0        # text-only 태스크의 zero enroll placeholder 길이(초)
  seed: 2026             # enroll/mixed-task 선택의 index-deterministic seed
                         # ⚠️ 학습 seed 이자 enroll 샘플링 결정성에도 쓰인다 — 바꾸면 enroll 선택이 달라진다

# --- Collate: 전역 기본값 (stage/split 엔트리의 collate override 가 우선) --------
#   방침(교수님 승인): 학습=고정 길이 random crop, 평가=full-length(기본)/chunk-slide(옵션).
#   ⚠️ 아래 값은 추후 재논의로 바뀔 수 있음 — 그 때 이 파일만 고치면 됨.
collate:
  crop_sec: null         # 전역 기본 = full-length. 각 stage/split 이 collate override 로 덮어씀.
  train: false           # crop_sec 가 설정된 경우에만 의미: True=random window, False=front window

# --- DataLoader --------------------------------------------------------------
#   ★ effective batch = batch_size * grad_accum = 56 으로 고정한다.
#     56 은 논문(arXiv:2501.09169, "batch size 56 across 8 NVIDIA V100 GPUs")과
#     원저자 run.sh(`--batch_size 56`) 양쪽이 쓰는 값이다. 장비가 바뀌면 batch_size 와
#     grad_accum 을 함께 조정해 곱이 56 을 유지할 것 (H200 8x7 / H100 4x14 / 4090 2x28).
loader:
  batch_size: 4          # 8 → 4 (2026-08-22, Stage-2 시작 시점). Stage-1 은 8×7 로 완주했고,
                         #   Stage-2 는 --init_from 으로 새로 시작하므로(global_step 0, best_val inf)
                         #   배치를 바꿔도 연속성 문제가 없다 — 바꾸기 가장 좋은 시점이다.
                         #   목적은 CosyVoice 와의 공존 여유 확보:
                         #     B8×7  peak ~89.5GiB → 여유 ~48GB   (LLM Full FT 30GB 까지만 안전)
                         #     B4×14 peak ~45.2GiB → 여유 ~93GB   (DPO/PO 35~42GB 도 여유)
                         #   대가는 속도다(단독 실측 5.46 → 7.41 s/step, +36%. epoch 1.08h → 1.47h).
                         #     · CosyVoice LLM Full FT reserved peak 30GB(실측)
                         #     · CosyVoice DPO/PO 는 H200 실측이 없다(추정 35~42GB) → --smoke 선행 필요 ⚠️
                         #   ⚠️ 진짜 병목은 VRAM 이 아니라 SM 경합이다 (CosyVoice 자체 실측:
                         #      단독 0.60 s/step → StyleTSE 동시 실행 시 4.65 s/step, 7배).
                         #      이는 배치 설정과 무관하며, 오히려 B8 은 같은 학습량을 25% 적은
                         #      GPU 시간에 처리해 co-tenant 에 돌아가는 SM 시간을 늘린다.
                         #
                         #   ── 실측 이력 ────────────────────────────────────────────────
                         #   2026-08-07 (LLM-TSE + CosyVoice3 + TSE_Eval 3-job 경합 조건):
                         #     B4×14  10.78 s/step  peak 45.2GiB  → free 64GiB 유지
                         #     B8×7    8.05 s/step  peak 89.5GiB  → free 18.8GiB
                         #     당시 B8 측정 중 CosyVoice3 가 14.3→22.0GB 로 8GB 출렁이는 것을
                         #     관측했고, 여유 18.8GB 로는 스윙 한 번에 OOM 이라 B4 를 택했다.
                         #   2026-08-13 (StyleTSE 단독, co-tenant 없음) — B8 전환 전후 실측:
                         #     B4×14  7.41 s/step   B8×7  6.71 s/step  → -9.4%
                         #     ※ 08-07 의 -25% 는 3-job 경합 상태의 값이다. 단독일 때는 B4 도
                         #       이미 GPU 를 충분히 채우고 있어 배치를 키운 이득이 그만큼 작다.
                         #   co-tenant 별 실측(6시간 중앙값, B4×14 구간):
                         #     단독 7.41 / +CosyVoice LLM-FT 9.6 (1.30x) / +LLM-TSE 15.65 (2.11x)
                         #     / +LLM-TSE +CosyVoice 17.07 (2.30x)
                         #   (full-length 평가는 추론만이라 17.2s B1≈1.45GB 로 매우 가볍다.)
  eval_batch_size: 4     # ★ dev/test 전용 배치 — 학습 batch_size 와 의도적으로 분리한다.
                         #   dev/test 는 full-length 라 collate 가 "배치 내 최장 길이"로 zero-pad
                         #   하는데, val loss 는 length mask 없이 패딩 구간까지 포함해 계산한다
                         #   (loss.py:24 에 명시. lengths 는 지표 계산에만 쓰인다 train.py:466-473).
                         #   ⇒ 배치를 키우면 배치-최장이 길어져 패딩 비율이 늘고(dev 실측:
                         #     B4 22.2% → B8 28.9%), target=0 구간의 모델 출력이 전부 오차항으로
                         #     잡혀 val loss 가 체계적으로 나빠진다. 그러면 체크포인트에 저장된
                         #     best_val(B4 기준)과 비교가 무효화되어 best/ 가 갱신되지 않는다.
                         #   4 로 고정하면 batch_size 를 바꿔도 검증 조건이 불변이라
                         #   best_val · TensorBoard val/loss 곡선이 그대로 이어진다.
                         #   ⚠️ 이 값을 바꾸면 과거 구간과 val/loss 비교가 불가능해진다.
                         #   (근본 해법인 val loss length masking 은 지난 구간 전체와 비교가
                         #    깨지므로 이번 run 에서는 적용하지 않는다 — 다음 run 의 과제.)
  num_workers: 4         # 8 → 4 (2026-08-07). H200 박스를 CosyVoice 학습·TSE_Eval 채점과
                         #   공유하므로 24 코어를 나눠 써야 한다.
                         #   · CosyVoice T6 = 4 워커 ≈6.2 코어 (실측)
                         #   · StyleTSE 4 워커 ≈5.5 코어 (추정) · TSE_Eval 채점 1~5 코어
                         #   · 시스템·도구 ≈1.5 코어              → 합 ≈18/24 (8이면 ≈22.7)
                         #   근거: docs/dataset_porte_v3.md:451,458,595 의 DataLoader 예시가
                         #   이미 4다. 기존 8은 원저자 코드(src/author_codes/.../
                         #   train_stage_1.py:114)에서 온 값. 샘플당 오디오 읽기는 2개
                         #   (dataset.py:456-457 mixed·target) + BERT 토크나이즈뿐이다.
                         #   ⚠️ 단 StyleTSE 는 로더 throughput 실측이 없다 — CosyVoice T6
                         #   처럼 "워커당 N batch/s vs 필요 M batch/s" 근거가 없으므로,
                         #   GPU util 이 낮게 깔리면(로더 병목) 올리는 것이 맞다.
                         #   num_workers 는 학습 시작 시점에 고정되니 시작 전에 정할 것.
                         #   2026-08-13 재검토: co-tenant 가 모두 종료되어 24 코어를 사실상
                         #   단독 사용하지만 4 를 유지한다. B8 전환으로 초당 샘플 수요가
                         #   6.9 → 9.3 samples/s (+35%) 로 늘지만, GPU util 이 98% 로 깔려
                         #   있어 로더 병목 징후가 없다(샘플당 wav 3개 읽기 = 워커당 0.43s 여유).
                         #   CosyVoice 를 틈틈이 돌릴 예정이라 코어를 남겨두는 쪽을 택했다.
  grad_accum: 14         # 7 → 14. effective batch = 4 * 14 = 56 (논문·원저자 run.sh 동일).
                         #   grad-accum 은 step 당 activation 메모리를 늘리지 않음.
                         #   ⇒ 1 epoch = floor(40000 / 4 / 14) = 714 optimizer steps —
                         #     B8×7 과 동일하므로 val_every/metric_every/early_stop.min_steps/
                         #     scheduler_warmup 은 재계산이 필요 없다.
                         #   실측 ETA(B4×14, 단독 7.41 s/step): epoch(715 step) 당 1.47h
                         #     → Stage-2 조기종료 70~100 epoch 기준 4.3~6.1일. (B8×7 은 3.2~4.5일)
                         #   ※ 학습 중 batch_size 를 바꿔 --resume 할 때 grad_accum 을 "줄이는"
                         #     방향은 안전하다: save 는 항상 sync 경계에서 일어나 저장된
                         #     accelerator.step 이 이전 grad_accum 의 배수이고, 14 의 배수는
                         #     7 의 배수이기도 하므로 첫 accumulation 그룹이 잘리지 않는다.
                         #     (반대로 7 → 14 는 50% 확률로 첫 그룹이 절반 크기가 된다.)

# --- Text encoder : frozen BERT [CLS] → 768 -------------------------------
#   scripts/download_bert.py 로 1회 받아두면 local_dir 로 오프라인 사용 가능.
text_encoder:
  model_name: bert-base-uncased
  max_length: 15                    # 팀원/원저자 동일. PORTE-v3 프롬프트 실측 최대 12 토큰
                                    # (48종 전수) → 절단 0건. 논문의 20 과 달라도 무해.
  # ⚠️ 절대경로. models/text_encoder.py 가 os.path.isdir() 로 판정하므로 상대경로면
  #    프로세스 CWD 에 따라 조용히 HF hub 로 폴백한다 (repo root 밖에서 launch 시 사고).
  local_dir: /home/work/my-code/styletse/ckpt/bert-base-uncased
  local_files_only: false           # true 면 local_dir(오프라인)만 사용

# ============================================================================
# ★ crop 방침 (학습 vs 검증을 분리한 이유)
# ----------------------------------------------------------------------------
#   학습(train) = 7초 random crop  ← 팀원 코드와 동일(레퍼런스 충실 재현).
#                 원저자는 3초@8kHz front crop, 팀원이 7초@24kHz random 으로 재작성.
#   검증(dev)   = full-length      ← collate override 를 두지 않아 전역 crop_sec: null 을 씀.
#
#   ⚠️ dev 를 crop 하지 않는 이유(우리 결정. 원저자·팀원은 dev 도 crop 했다):
#     7초 front crop 시 dev 5,000개 중 280개(5.60%)는 target 이 crop 창 밖에 있어
#     완전 무음이 된다(overlap 0.0 bin 에 집중, 그 bin 의 36.7%). 그러면 SI-SDR 이
#     ≈-80 으로 폭주하고 pystoi 는 ESTOI 를 1e-5 로 반환한다.
#     → val/si_sdr 이 4~5 dB 과소평가되어 최종 eval.py(full-length test) 수치와
#       직접 비교할 수 없게 된다. dev 를 full-length 로 두면 두 값이 같은 조건이 된다.
#     ※ 학습 crop 은 건드리지 않으므로 학습 다이나믹은 레퍼런스와 동일하다.
#        (학습측 무음 crop ~2.19% 는 의도적으로 그대로 둔다 — train.py:297-311 참고)
# ============================================================================

# --- Stage 1 : audio-text 고정 ----------------------------------------------
stage1:
  train: { split: train, task: audio-text, collate: { crop_sec: 7.0, train: true } }
  dev:   { split: dev,   task: audio-text }   # collate override 없음 → full-length

# --- Stage 2 : per-sample modality mixing -----------------------------------
stage2:
  # 학습 = mixed. 샘플별로 audio-text : text-only : audio-only = 2 : 2 : 1 (논문 §Stage-2).
  #   비율은 dataset.py 의 _MIXED_CHOICES 가중 튜플이 결정한다(근거 주석은 그쪽 참고).
  # 검증 = mixed (2026-08-22 결정 — 원저자 프로토콜 충실).
  #   원저자·팀원 모두 Stage-2 dev 를 mixed 로 둔다(train_stage_2.py:242 task='mixed').
  #   baseline 의 정의를 "원저자 방식으로 학습한 StyleTSE"로 잡았으므로, 체크포인트
  #   선택 기준도 그 방식을 따른다.
  #   ※ 검토된 trade-off (결정 시 인지한 사항):
  #     - TPEX 는 enrollment 개념이 없는 text-only 전용 모델이고, best 를 dev 5,000
  #       전수 평균 SI-SDR 로 고른다(tpex/train/trainer.py:766-778, 동일 asteroid 수식).
  #       dev 를 text-only 로 두면 두 기준이 부호만 다른 동일 통계량이 되지만,
  #       mixed 로 두면 판정값의 60%(2:2:1 중 audio-text 2 + audio-only 1)가
  #       TPEX 가 받지 못하는 enrollment cue 로 만들어진다.
  #     - Stage-1 실측: epoch 62→79 구간에서 audio-text 14.77→16.72(상승)인데
  #       text-only 는 10.29→7.86(하락). enrollment 가 섞인 기준은 이 구간을
  #       "개선"으로 읽는다(exp_reports/stage1/run_stage1.md §6).
  #   → 그래서 train.py 가 val_by_task/* 로 시나리오별 loss·지표를 함께 남긴다.
  #      text-only 곡선이 baseline 표와 같은 조건이므로 그쪽을 병행 추적할 것.
  train: { split: train, task: mixed,     collate: { crop_sec: 7.0, train: true } }
  dev:   { split: dev,   task: mixed }        # collate override 없음 → full-length

# --- 평가 : text-only (TPEX 비교) -------------------------------------------
#   test 로더는 collate override 없음 → 전역 full-length(crop 없음).
#   inference.py / eval.py 산출물은 <results_dir>/<run_name>/{preds,eval}/ 아래에 저장.
results_dir: /home/work/my-outputs/styletse   # <run_name>/preds/*.wav + manifest.csv + eval/*.csv
                                              # vFolder(영속). 저장소 안 상대경로에 두면 세션 재생성 시 소실된다
eval:
  test:  { split: test,  task: text-only }
  # 추론 방식(고정 저장). PORTE-v3(≤17.2s)는 full-length 추론이 ~1.45GB로 충분 → 기본 full-length.
  inference:
    mode: full-length      # full-length | chunk-slide
    chunk_sec: 5.0         # chunk-slide 일 때 chunk 길이(초)
    overlap_sec: 1.0       # chunk-slide 일 때 겹침(초)
    method: overlap-add    # overlap-add(crossfade, 팀원) | overlap-save(context-discard, AudioSep식)
    window: linear         # overlap-add 크로스페이드: linear | hann

# --- 학습 루프(train.py, accelerate + bf16 + TensorBoard) --------------------
#   실행: accelerate launch train.py --config configs/config.yaml --stage stage1
#   ★ 아래 step 기반 주기는 모두 "1 epoch = 714 steps"(effective batch 56) 기준이다.
#     loader.batch_size / grad_accum 을 바꿔 effective batch 가 56 이 아니게 되면
#     val_every / metric_every / early_stop.min_steps 를 함께 재계산할 것.
train:
  lr: 1.0e-4                 # 원저자 run.sh(`--lr 0.0001`) 기준. 양 stage 동일.
                             #   논문은 Stage1 2e-4 / Stage2 1.5e-4 지만 원저자 코드 기준을 채택(결정 완료).
  epochs: 200
  max_steps: null            # null이면 epochs 기준. 값 주면 먼저 도달 시 종료.
                             #   CLI `--max_steps` 로 덮어쓸 수 있다 (논문 Stage-1 ≈100k steps).
  clip_grad_norm: 5.0
  scheduler: { factor: 0.5, patience: 2, min_lr: 1.0e-6 }   # ReduceLROnPlateau(val loss)
                             #   원저자와 값 동일. 원저자는 epoch 당 1회 step 하므로
                             #   val_every 를 1 epoch 분량(714)에 맞춰 "2 epoch 정체 시 halve"를 재현한다.
                             #   ★ 시작 시점은 stage_overrides.scheduler_warmup_epochs 참고
                             #     (그 전까지 lr 은 1.0e-4 로 고정 — 원저자 `if epoch > 70:` 재현)
  log_every: 50              # scalar(train loss/grad_norm/lr) 로깅 주기(optimizer steps)
  val_every: 714             # validation + checkpoint + 미디어 로깅 주기(steps) = 1 epoch
  metric_every: 3570         # ★ SI-SDR/SI-SDRi/ESTOI(24k)+PESQ(16k) 계산 주기(steps) = 5 epoch.
                             #   ⚠️ metric_every 는 val_every 의 배수여야 한다 — 지표 계산이
                             #      val_every 블록 안에서 판정되므로 배수가 아니면 영영 안 돈다.
  # --- 검증 범위: loss 와 지표를 분리한다 -------------------------------------
  #   loss  = dev 전체(5,000). best 체크포인트가 이 값으로 결정되므로 전수 평균을 쓴다.
  #           원저자도 동일하다 — train_stage_2.py::validate 가 dataloader 전체를 돌고
  #           `return total_loss / total_count` 를 낸다(제한 없음).
  #           실측 16.9분/epoch = 학습 3.1시간 대비 ~9% 로 감당 가능.
  #   지표  = 앞 metric_max_samples 개만. PESQ/ESTOI 는 CPU 직렬이라 실측 0.58 s/sample →
  #           dev 전체면 48.7분. 학습 중 추세 확인 목적에는 100개로 충분하고,
  #           논문에 싣는 최종 수치는 eval.py 가 test 5,000 전체로 따로 산출한다.
  #   (참고) LLM-TSE 는 val_max_batches=50(bs 1)로 loss·지표를 함께 50개로 줄인다.
  #          우리는 best 판정의 안정성을 위해 loss 만은 전수로 유지한다.
  val_max_batches: null      # null = 전체 dev (loss). smoke/디버그 시에만 소수(예: 2)로 제한
  metric_max_samples: 100    # 지표를 계산할 dev 앞쪽 샘플 수. null = 전체(느림).
                             #   val_loader 는 shuffle=False 라 매번 동일한 앞 100개 → 재현 가능
  ckpt_keep: 3               # step_* 를 최근 N개만 유지(rolling). `best/` 는 rotate 대상이 아니라
                             #   항상 보존되므로, 200 epoch 중 언제 중단해도 최고 체크포인트는 남는다.
                             #   best 판정 기준 = dev validation loss(negative SI-SDR).
                             #   원저자·팀원도 동일 기준(팀원 `val_loss < best_val_loss`,
                             #   원저자 `float(total_loss) < -12` — total_loss 는 validate() 반환값).
  ckpt_dir: /home/work/my-checkpoints/styletse   # <run_name>/<stage>/{step_*,best}
                                                 # vFolder(영속). 상대경로면 세션 재생성 시 소실
  run_dir: runs              # runs/<run_name>/<stage>/tb (TensorBoard, gitignore)
  mel: { n_fft: 1024, hop_length: 256, n_mels: 80 }          # TensorBoard mel 시각화용
  # Early stopping (Stage-2 전용 — 아래 stage_overrides 참고).
  #   min_steps 35700 = 50 epoch (팀원 early_stop_min_epochs=50 과 동일)
  #   patience 20 = 20회 연속 비개선 검증 = 20 epoch (팀원 early_stop_patience=20 과 동일)
  early_stop: { enabled: true, min_steps: 35700, patience: 20, min_delta: 0.01 }

  # ==========================================================================
  # ★ stage 별 재정의 — 원저자/팀원 코드 재현. train.py 가 위 train.* 위에 deep-merge 한다.
  # --------------------------------------------------------------------------
  #  scheduler_warmup_epochs:
  #     이 epoch 수에 도달하기 전에는 ReduceLROnPlateau 를 아예 호출하지 않는다
  #     (= lr 이 train.lr 로 고정). 원저자·팀원 모두 하드코딩:
  #        Stage-1  `if epoch > 70: scheduler.step(val_loss)`   train_stage_1.py:180 / :337
  #        Stage-2  `if epoch > 40: scheduler.step(total_loss)` train_stage_2.py:285 / :410
  #     논문은 stage 구분 없이 한 문장만 쓴다: "starting with a learning rate of 2e-4
  #     for stage one, reduced to 1.5e-4 for stage two and halved if validation loss
  #     stalls for two consecutive epochs *after 70 epochs*, until it drops below 1e-6".
  #     ⇒ Stage-1(70)은 논문과 일치하지만, **Stage-2(40)는 논문에 근거가 없다**.
  #        논문에는 Stage-2 전용 임계값 자체가 없고 70 하나만 나온다.
  #        추정: 원저자 Stage-2 는 epoch 카운터를 0 부터 새로 시작하고(run.sh 는 Stage-1
  #        체크포인트를 epoch 30~40 에서 고르라고 한다), 30 + 40 = 누적 ~70 이 되어
  #        논문의 "after 70 epochs"(두 stage 합산)와 맞아떨어진다. 코드에 명시된 바는 아니다.
  #        우리는 "논문보다 원저자 코드 기준" 방침에 따라 40 을 유지한다(결정 완료).
  #     ⚠️ 이게 없으면 val_every=1epoch + patience=2 조합 탓에 epoch 17 쯤에 lr 이
  #        반토막 나서, 원저자가 말한 "좋은 ckpt 는 epoch 30~40"(lr 고정 구간) 재현이 깨진다.
  #     step 환산은 train.py 가 런타임에 steps_per_epoch 로 계산하므로 배치를 바꿔도 안전하다.
  #     정밀도 참고: 원저자 루프는 0-based + strict `>` 라 `epoch > N` 의 첫 호출이
  #     1-based N+2 번째 epoch 이다. 우리는 "처음 N epoch 동안 감쇠 없음"으로 단순화했으므로
  #     첫 halving 이 2 epoch 빠르다 (patience=2 → 첫 호출 +3 회째에 감쇠):
  #        Stage-1  우리 epoch 73 / 원저자 75
  #        Stage-2  우리 epoch 43 / 원저자 45
  #     200 epoch 규모에서 무시 가능하다고 보고 현행 유지(결정 완료).
  #
  #  early_stop:
  #     원저자·팀원 모두 Stage-1 에는 early stopping 이 없다(200 epoch 완주).
  #     팀원은 Stage-2 에만 추가했다(min_epochs 50 / patience 20 / min_delta 0.01).
  #     Stage-1 의 min_delta 를 0 으로 두는 것도 팀원과 맞추기 위함
  #     (팀원 Stage-1 은 `if val_loss < best_val_loss:` 로 순수 비교).
  # ==========================================================================
  stage_overrides:
    stage1:
      scheduler_warmup_epochs: 70
      early_stop: { enabled: false, min_delta: 0.0 }
    stage2:
      scheduler_warmup_epochs: 40
      early_stop: { enabled: true, min_steps: 35700, patience: 20, min_delta: 0.01 }
